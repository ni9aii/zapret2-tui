[package]
name = "zapret2-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal UI for zapret2 — DPI bypass manager"

[[bin]]
name = "zapret2-tui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ctrlc.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
zapret2-core.workspace = true
chrono = "0.4.45"

[workspace]
resolver = "2"
members = [
    "crates/zapret2-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ni9aii/zapret2-tui"
authors = ["ni9aii <ni9aii@proton.me>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
ctrlc = "3"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"
nix = { version = "0.31", features = ["process", "signal"] }
zapret2-core = { path = "crates/zapret2-core" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1