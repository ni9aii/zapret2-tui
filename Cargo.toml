[workspace]
resolver = "2"
members = [
    "crates/zapret2-core",
    "crates/zapret2-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ni9aii/zapret2-tui"
authors = ["ni9aii <ni9aii@proton.me>"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "wrap_help"] }
ctrlc = "3"
ratatui = "0.29"
crossterm = "0.28"
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1