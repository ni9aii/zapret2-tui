[package]
name = "zapret2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for managing zapret2 nfqws2 daemon and firewall rules"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
serde = { workspace = true }
serde_json.workspace = true
toml.workspace = true
which = "8.0.2"
shell-words = "1.1.1"
libc = "0.2.186"
nix = { workspace = true, features = ["process", "signal"] }

[features]
# Integration tests that drive a real zapret2 install (nfqws2 + nftables).
# Enable with `--features integration`. Requires root and a built nfqws2 at
# $ZAPRET_BASE/nfq2/nfqws2 (see .github/workflows/ci.yml `integration` job).
integration = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
