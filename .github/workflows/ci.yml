name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Build dependencies for the upstream nfqws2 binary (used by the integration job).
  NFQWS2_APT: >-
    build-essential pkg-config libnetfilter-queue-dev libnetfilter-conntrack-dev
    libnfnetlink-dev libmnl-dev nftables libpcap-dev libluajit-5.1-dev
    libcap-dev zlib1g-dev

jobs:
  # ---------------------------------------------------------------------------
  # Host build/test matrix, x86_64, distro fan-out (each distro runs inside a
  # container). All checks are root-free host tests plus fmt/clippy/msrv.
  # ---------------------------------------------------------------------------
  matrix-build-x86_64:
    name: "matrix x86_64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            emoji: "🐧"
            runner: ubuntu-latest
            container: '{"image":"ubuntu:24.04"}'
            toolchain: stable
            experimental: false
          - distro: ubuntu
            emoji: "🐧"
            runner: ubuntu-latest
            container: '{"image":"ubuntu:24.04"}'
            toolchain: beta
            experimental: true
          - distro: ubuntu
            emoji: "🐧"
            runner: ubuntu-latest
            container: '{"image":"ubuntu:24.04"}'
            toolchain: nightly
            experimental: true
          - distro: ubuntu
            emoji: "🐧"
            runner: ubuntu-latest
            container: '{"image":"ubuntu:24.04"}'
            toolchain: "1.88" # MSRV
            experimental: false
          - distro: debian
            emoji: "🌀"
            runner: ubuntu-latest
            container: '{"image":"debian:bookworm"}'
            toolchain: stable
            experimental: false
          - distro: debian
            emoji: "🌀"
            runner: ubuntu-latest
            container: '{"image":"debian:bookworm"}'
            toolchain: "1.88"
            experimental: false
          - distro: fedora
            emoji: "🎩"
            runner: ubuntu-latest
            container: '{"image":"fedora:41"}'
            toolchain: stable
            experimental: false
          - distro: fedora
            emoji: "🎩"
            runner: ubuntu-latest
            container: '{"image":"fedora:41"}'
            toolchain: "1.88"
            experimental: false
          # alpine uses musl libc; the container build yields a musl binary.
          - distro: alpine
            emoji: "🏔️"
            runner: ubuntu-latest
            container: '{"image":"alpine:3.20"}'
            toolchain: stable
            experimental: false
          - distro: alpine
            emoji: "🏔️"
            runner: ubuntu-latest
            container: '{"image":"alpine:3.20"}'
            toolchain: "1.88"
            experimental: false
    uses: ./.github/workflows/reusable-build.yml
    with:
      distro: ${{ matrix.distro }}
      emoji: ${{ matrix.emoji }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}
      arch: x86_64
      toolchain: ${{ matrix.toolchain }}
      experimental: ${{ matrix.experimental }}

  # ---------------------------------------------------------------------------
  # Host build/test matrix, aarch64, native arm runners (no QEMU on the hot
  # path; the architecture is exercised on real silicon).
  # ---------------------------------------------------------------------------
  matrix-build-aarch64:
    name: "matrix aarch64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-arm
            emoji: "🐧"
            runner: ubuntu-24.04-arm
            toolchain: stable
            experimental: false
          - distro: ubuntu-arm
            emoji: "🐧"
            runner: ubuntu-24.04-arm
            toolchain: "1.88"
            experimental: false
          - distro: ubuntu-arm
            emoji: "🐧"
            runner: ubuntu-24.04-arm
            toolchain: nightly
            experimental: true
    uses: ./.github/workflows/reusable-build.yml
    with:
      distro: ${{ matrix.distro }}
      emoji: ${{ matrix.emoji }}
      runner: ${{ matrix.runner }}
      container: ""
      arch: aarch64
      toolchain: ${{ matrix.toolchain }}
      experimental: ${{ matrix.experimental }}

  # ---------------------------------------------------------------------------
  # Integration: drive a REAL zapret2 install (nfqws2 + nftables) in direct
  # mode. Requires root (the GitHub-hosted runner provides it) and the
  # nfnetlink_queue kernel module (present on hosted runners).
  # ---------------------------------------------------------------------------
  integration:
    name: integration ${{ matrix.arch }}
    needs: [matrix-build-x86_64, matrix-build-aarch64]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Install build deps + nft
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ env.NFQWS2_APT }}

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build nfqws2 from upstream
        run: |
          git clone --depth 1 https://github.com/bol-van/zapret2.git /opt/zapret2
          ( cd /opt/zapret2/nfq2 && make )
          test -x /opt/zapret2/nfq2/nfqws2 || { echo "nfqws2 build failed"; exit 1; }
          echo "nfqws2: $(/opt/zapret2/nfq2/nfqws2 2>&1 | head -1)"

      - name: Run integration tests (root, direct mode)
        run: |
          sudo env "PATH=$PATH" "ZAPRET_BASE=/opt/zapret2" \
            cargo test --locked --features integration \
              --package zapret2-core --test integration_zapret -- --nocapture

  # ---------------------------------------------------------------------------
  # Release artifacts (only on tag push).
  # ---------------------------------------------------------------------------
  build:
    name: build release ${{ matrix.arch }}
    needs: [matrix-build-x86_64, matrix-build-aarch64, integration]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --locked --release --workspace
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/zapret2-tui
            target/release/zapret2-helper
